<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#010706">
  <title>Algorithomus — modo offline</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#010706;color:#f4f4f4;font:16px system-ui,sans-serif}
    body{display:grid;place-items:center;padding:28px;text-align:center}
    main{max-width:440px}
    h1{font-size:1.8rem;margin:0 0 .5rem}
    p{line-height:1.6;color:#c8d5d3}
    button{margin-top:18px;border:0;border-radius:999px;padding:13px 22px;background:#20a89c;color:#00110f;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Algorithomus</h1>
    <p>O aplicativo não conseguiu acessar o servidor oficial. Esta tela local confirma que a estrutura offline está carregada. O conteúdo jogável offline será integrado com os arquivos originais em uma etapa posterior.</p>
    <button onclick="location.href='https://algorithomus.com.br/'">Tentar conectar novamente</button>
  </main>
</body>
</html>
