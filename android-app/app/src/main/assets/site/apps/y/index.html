<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Y</title>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/feed.css?v=2">
    <link rel="stylesheet" href="css/profile.css">
    <style>.offline{min-height:100%;display:grid;place-content:center;gap:10px;padding:32px;text-align:center}.app[hidden],.offline[hidden]{display:none}.offline__icon{font-size:36px}.offline h1{font-size:18px}.offline p{color:var(--text-dim);font-size:14px}</style>
</head>
<body>

<main class="offline" id="offline" role="status">
    <span class="offline__icon" aria-hidden="true">⌁</span>
    <h1>Sem internet</h1>
    <p>Sem internet, se conecte a internet para ter acesso a novos posts</p>
</main>

<div class="app" id="app" hidden>


    <header class="topbar">
        <button class="topbar__back" id="topbarBack" data-action="back" hidden aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="topbar__titles">
            <span class="topbar__logo" id="topbarLogo">Y</span>
            <span class="topbar__title" id="topbarTitle">Início</span>
        </div>
        <button class="topbar__me" data-action="open-my-profile" aria-label="Meu perfil">
            <span class="avatar avatar--sm" id="topbarMe"></span>
        </button>
    </header>

    <main class="views" id="views">


        <section class="view" id="view-home">
            <div class="feed" id="feed"></div>
        </section>


        <section class="view" id="view-explore" hidden>
            <div class="explore" id="explore"></div>
        </section>


        <section class="view" id="view-notif" hidden>
            <div class="notifs" id="notifs"></div>
        </section>


        <section class="view" id="view-profile" hidden>
            <div class="profile" id="profile"></div>
        </section>


        <section class="overlay" id="view-detail" hidden>
            <header class="overlay__head">
                <button class="overlay__back" data-action="close-detail" aria-label="Voltar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <span class="overlay__title">Post</span>
            </header>
            <div class="detail" id="detail"></div>
            <div class="replybar" id="replybar">
                <input class="replybar__input" id="replyInput" type="text" placeholder="Postar sua resposta" maxlength="280" autocomplete="off">
                <button class="replybar__send" data-action="send-reply" disabled="disabled">Responder</button>
            </div>
        </section>


        <section class="overlay" id="view-compose" hidden>
            <header class="overlay__head overlay__head--compose">
                <button class="overlay__cancel" data-action="close-compose">Cancelar</button>
                <button class="btn-primary" id="composePost" data-action="publish" disabled="disabled">Postar</button>
            </header>
            <div class="compose">
                <span class="avatar" id="composeAvatar"></span>
                <textarea class="compose__text" id="composeText" placeholder="O que está acontecendo?" maxlength="280"></textarea>
            </div>
            <div class="compose__foot">
                <span class="compose__count" id="composeCount">280</span>
            </div>
        </section>

    </main>


    <button class="fab" id="fab" data-action="open-compose" aria-label="Postar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>


    <nav class="tabbar" id="tabbar">
        <button class="tab is-active" data-tab="home" aria-label="Início">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        </button>
        <button class="tab" data-tab="explore" aria-label="Explorar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="tab" data-tab="notif" aria-label="Notificações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="tab__badge" id="notifBadge" hidden></span>
        </button>
        <button class="tab" data-tab="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
    </nav>

</div>

<script src="js/dom.js?v=protected-dia6-4"></script>
<script src="../../js/app-theme.js?v=protected-dia6-4"></script>
<script src="js/bridge.js?v=protected-dia6-4"></script>
<script src="js/data.js?v=protected-dia6-4"></script>
<script src="js/feed.js?v=protected-dia6-4"></script>
<script src="js/composer.js?v=protected-dia6-4"></script>
<script src="js/profile.js?v=protected-dia6-4"></script>
<script src="../ghost-touch.js?v=protected-dia6-4"></script>
<script src="js/main.js?v=protected-dia6-4"></script>

</body>
</html>
