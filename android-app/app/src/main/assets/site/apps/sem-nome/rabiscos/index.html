  <title>Rabiscos</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }

    body {
      overflow: hidden;
      background: #000;
    }

    .tile-animado {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(var(--colunas, 1), var(--tile-size, 115.2px));
      grid-auto-rows: var(--tile-size, 115.2px);
    }

    .tile-animado img {
      display: block;
      width: var(--tile-size, 115.2px);
      height: var(--tile-size, 115.2px);
    }
  </style>
</head>
