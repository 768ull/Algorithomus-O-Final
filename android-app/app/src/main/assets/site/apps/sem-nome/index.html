<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Diário Pessoal</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/diary.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="app">
        <div class="shade-layer" aria-hidden="true"></div>
        <header class="topbar">
            <div><p class="eyebrow">caderno pessoal</p><h1>Meu diário</h1></div>
            <span class="date">minhas páginas</span>
        </header>
        <section class="content" id="listView" aria-label="Notas do diário">
            <div class="intro"><h2>Um dia de cada vez</h2><p>Escolha uma página para abrir.</p></div>
            <div class="notes" id="notes"></div>
        </section>
        <section class="content detail" id="detailView" aria-label="Página do diário" hidden>
            <article class="paper">
                <p class="eyebrow">página do diário</p>
                <h2 id="detailTitle">Dia1</h2>
                <p class="paper-meta">Sua página, suas lembranças.</p>
                <div class="voice" aria-label="Player de áudio do diário">
                    <button class="voice-play" id="audioPlay" type="button" aria-label="Reproduzir áudio do Dia1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5c0-.8.9-1.3 1.6-.8l9.1 6.1a1.4 1.4 0 0 1 0 2.4l-9.1 6.1c-.7.5-1.6 0-1.6-.8z"/></svg></button>
                    <div class="voice-main">
                        <div class="voice-wave" aria-hidden="true"><i style="height:12px"></i><i style="height:22px"></i><i style="height:15px"></i><i style="height:28px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:24px"></i><i style="height:15px"></i><i style="height:29px"></i><i style="height:19px"></i><i style="height:11px"></i><i style="height:23px"></i><i style="height:16px"></i><i style="height:27px"></i><i style="height:13px"></i><i style="height:20px"></i><i style="height:9px"></i><i style="height:25px"></i><i style="height:15px"></i><i style="height:21px"></i></div>
                        <div class="voice-progress" aria-hidden="true"><span id="audioProgressFill"></span></div>
                        <div class="voice-caption"><span id="audioLabel">Áudio · Dia 1</span><span><span id="audioCurrent">0:00</span> / <span id="audioDuration">0:00</span></span></div>
                        <p class="voice-status" id="audioStatus" role="status" aria-live="polite"></p>
                    </div>
                </div>
                <div class="paper-rule"></div>
                <div class="writing transcript" id="transcript" aria-label="Transcrição do áudio">A transcrição aparecerá conforme o áudio tocar.</div>
            </article>
        </section>
    </main>
    <script src="js/app.js?v=protected-dia6-4" defer></script>
    <script src="js/bridge.js?v=protected-dia6-4"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"451128a797b846018b2b107a2f794d60","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
