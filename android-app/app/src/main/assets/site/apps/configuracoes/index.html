<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Configurações</title>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/wifi.css?v=5">
    <link rel="stylesheet" href="../../css/glitch.css?v=2">
    <link rel="stylesheet" href="css/wifi-glitch.css?v=1">
</head>
<body>

<div class="app">

    <header class="bar">
        <button class="bar__back" id="barBack" data-action="back" hidden aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="bar__titles">
            <h1 class="bar__title" id="barTitle">Configurações</h1>
            <p class="bar__sub" id="barSub">—</p>
        </div>
    </header>


    <div class="view" id="view"></div>




    <div class="sheet" id="sheet" hidden>
        <div class="sheet__scrim" data-action="sheet-cancel"></div>

        <div class="sheet__panel" role="dialog" aria-labelledby="sheetName">
            <div class="sheet__head">
                <h2 class="sheet__name" id="sheetName">—</h2>
                <p class="sheet__sub" id="sheetSub">a rede pede senha</p>
            </div>

            <label class="field">
                <input type="password" id="sheetPass" placeholder="senha" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="7" pattern="[A-Z][0-9][A-Z][0-9][A-Z][0-9][A-Z]">
                <button type="button" class="field__eye" data-action="sheet-eye" aria-label="Mostrar a senha">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </label>

            <p class="sheet__error" id="sheetError" hidden></p>

            <div class="sheet__row">
                <button class="btn btn--ghost" data-action="sheet-cancel">Cancelar</button>
                <button class="btn btn--solid" id="sheetGo" data-action="sheet-go">Conectar</button>
            </div>
        </div>
    </div>

</div>
