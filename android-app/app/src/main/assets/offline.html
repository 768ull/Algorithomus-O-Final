<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050909">
  <title>Algorithomus — modo offline</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050909;color:#f4f4f4;font:16px system-ui,sans-serif}
    body{display:grid;place-items:center;padding:28px;text-align:center}
    main{max-width:440px}h1{font-size:1.8rem;margin-bottom:.5rem}p{line-height:1.6;color:#c8d5d3}
    button{margin-top:18px;border:0;border-radius:999px;padding:13px 22px;background:#20a89c;color:#00110f;font-weight:700}
  </style>
</head>
<body><main>
  <h1>Algorithomus</h1>
  <p>Você está sem conexão com o servidor oficial. A estrutura offline do aplicativo está instalada; o conteúdo jogável local será integrado após a extração e validação dos arquivos originais do jogo.</p>
  <button onclick="location.href='https://algorithomus.com.br/'">Tentar conectar novamente</button>
</main></body></html>
