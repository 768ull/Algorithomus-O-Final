name: Build signed Algorithomus Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleRelease

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/algorithomus-release.jks"
          test -s "$RUNNER_TEMP/algorithomus-release.jks"

      - name: Sign with V1, V2, V3 and V4
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/algorithomus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x scripts/sign-release.sh
          scripts/sign-release.sh

      - name: Upload signed APK and V4 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: algorithomus-android-release
          path: |
            android-app/app/build/outputs/apk/release/algorithomus-release.apk
            android-app/app/build/outputs/apk/release/algorithomus-release.apk.idsig
          if-no-files-found: error
          retention-days: 30
